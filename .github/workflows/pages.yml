name: Pubblica Volley Info Virtus Caserta
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
  workflow_dispatch:
  schedule:
    - cron: '13 */3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: virtus-volley-info-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow


      - name: Scarica e ottimizza il logo ufficiale Virtus HD
        shell: bash
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          import requests
          from PIL import Image
          url="https://www.virtuscaserta.com/images/negativo@4x.png"
          target=Path("logos/virtus_caserta_hq.webp")
          target.parent.mkdir(parents=True,exist_ok=True)
          try:
              r=requests.get(url,timeout=40,headers={"User-Agent":"Mozilla/5.0 (compatible; Virtus-Volley-Info/1.0)"})
              r.raise_for_status()
              source=Image.open(io.BytesIO(r.content))
              if source.width<1000 or source.height<1400 or source.width/source.height>0.95:
                  raise ValueError("Risoluzione o proporzioni non valide per il logo ufficiale")
              image=source.convert("RGBA")
              image.thumbnail((720,960),Image.Resampling.LANCZOS)
              tmp=target.with_suffix(".tmp.webp")
              image.save(tmp,"WEBP",quality=90,method=5,exact=True)
              tmp.replace(target)
              print("Logo ufficiale confermato",source.size,"->",image.size,"bytes",target.stat().st_size,flush=True)
          except Exception as exc:
              if not target.exists() or target.stat().st_size<12000:
                  raise RuntimeError("Logo HD non disponibile e nessuna copia locale di backup: "+str(exc)) from exc
              print("Logo ufficiale temporaneamente irraggiungibile. Uso la copia HD salvata:",exc,flush=True)
          PY

      - name: Verifica JS, calendario e aggiornamenti straordinari
        run: |
          node --check app.js
          node --check sw.js
          node --test tests/*.test.cjs

      - name: Prepara gli asset della PWA
        shell: bash
        run: |
          mkdir -p public/icons public/logos
          cp index.html app.js week.js style.css sw.js manifest.webmanifest public/
          cp -R logos/. public/logos/
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open("icons/icon-source.png").convert("RGBA")
          out=Path("public/icons")
          for size,name in [(192,"icon-192.png"),(512,"icon-512.png"),(180,"apple-touch.png")]:
              src.resize((size,size),Image.Resampling.LANCZOS).save(out/name,optimize=True)
          mask=Image.new("RGBA",(512,512),"#0b142a")
          icon=src.resize((385,385),Image.Resampling.LANCZOS)
          mask.alpha_composite(icon,((512-385)//2,(512-385)//2))
          mask.save(out/"icon-maskable-512.png",optimize=True)
          PY

      - name: Acquisisci direttamente da FIPAV Caserta e Campania
        timeout-minutes: 18
        run: |
          python -u importer/direct.py --output public/data.json --previous data.json
          python - <<'PY'
          import json
          p=json.load(open("public/data.json"))
          assert p["provenance"]["method"]=="direct-fipav"
          assert len(p["competitions"])==9 and len(p["matches"])>=180
          print("Confermato:",len(p["matches"]),"gare dirette FIPAV, nessun feed di terzi")
          PY

      - name: Recupera e valida i loghi delle squadre
        timeout-minutes: 6
        run: |
          python -u importer/logos.py public/data.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Conserva ultima copia verificata in GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach origin/main
            cp public/data.json data.json
            cp public/logos/virtus_caserta_hq.webp logos/virtus_caserta_hq.webp
            git add data.json logos/virtus_caserta_hq.webp
            if git diff --cached --quiet; then
              echo "Archivio FIPAV invariato."
              exit 0
            fi
            git commit -m "Aggiorna archivio FIPAV e logo Virtus HD [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Aggiornamento concorrente, riprovo: $attempt"
            sleep 2
          done
          echo "Archivio pubblicato nel sito, ma salvataggio Git non riuscito."
          exit 1
