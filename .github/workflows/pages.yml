name: Pubblica Volley Info Virtus Caserta
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
  workflow_dispatch:
  schedule:
    - cron: '13 */3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: virtus-volley-info-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Prepara gli asset della PWA
        shell: bash
        run: |
          mkdir -p public/icons public/logos
          cp index.html app.js style.css sw.js manifest.webmanifest public/
          cp logos/virtus_caserta_original.png public/logos/
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open("icons/icon-source.png").convert("RGBA")
          out=Path("public/icons")
          for size,name in [(192,"icon-192.png"),(512,"icon-512.png"),(180,"apple-touch.png")]:
              src.resize((size,size),Image.Resampling.LANCZOS).save(out/name,optimize=True)
          mask=Image.new("RGBA",(512,512),"#0b142a")
          icon=src.resize((385,385),Image.Resampling.LANCZOS)
          mask.alpha_composite(icon,((512-385)//2,(512-385)//2))
          mask.save(out/"icon-maskable-512.png",optimize=True)
          PY

      - name: Acquisisci direttamente da FIPAV Caserta e Campania
        timeout-minutes: 18
        run: |
          python -u importer/direct.py --output public/data.json --previous data.json
          python - <<'PY'
          import json
          p=json.load(open("public/data.json"))
          assert p["provenance"]["method"]=="direct-fipav"
          assert len(p["competitions"])==9 and len(p["matches"])>=180
          print("Confermato:",len(p["matches"]),"gare dirette FIPAV, nessun feed di terzi")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Conserva ultima copia verificata in GitHub
        shell: bash
        run: |
          cp public/data.json data.json
          if ! git diff --quiet -- data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Aggiorna archivio diretto FIPAV [skip ci]"
            git push origin HEAD:main
          fi
